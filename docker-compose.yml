version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tuniedu-postgres
    restart: always
    environment:
      POSTGRES_USER: tuniedu_user
      POSTGRES_PASSWORD: tuniedu_password_2026
      POSTGRES_DB: tuniedu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tuniedu-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: tuniedu-storage
    restart: always
    environment:
      MINIO_ROOT_USER: tuniedu_admin
      MINIO_ROOT_PASSWORD: tuniedu_secure_storage_2026
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
